  <script>
    // ==========================================
    // 1. CONFIG & SAFE STATE
    // ==========================================
    const DEFAULT_CONFIG = {
      token: '',
      repo: 'TechIsInMyDNA/SGM-PATIENT-CARE-DASHBOARD',
      path: 'data.json',
      pass: ''
    };

    function safeJsonParse(val, fallback) {
      try { return val ? JSON.parse(val) : fallback; } catch (e) { return fallback; }
    }

    let APP_STATE = {
      config: Object.assign({}, DEFAULT_CONFIG, safeJsonParse(localStorage.getItem('sgm_cfg'), {})),
      patients: safeJsonParse(localStorage.getItem('sgm_patients'), {}),
      patientKeys: safeJsonParse(localStorage.getItem('sgm_p_keys'), {}),
      currentPatientId: null,
      isPatientView: false,
      fileSha: localStorage.getItem('sgm_file_sha') || null
    };

    // ==========================================
    // 2. CRYPTO ENGINE (AES-GCM 256-BIT)
    // ==========================================
    const CryptoEngine = {
      async deriveKey(passphrase, salt) {
        const enc = new TextEncoder();
        const keyMaterial = await crypto.subtle.importKey(
          'raw', enc.encode(passphrase), 'PBKDF2', false, ['deriveKey']
        );
        return await crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
          keyMaterial,
          { name: 'AES-GCM', length: 256 },
          false,
          ['encrypt', 'decrypt']
        );
      },

      async encrypt(plainObject, passphrase) {
        const salt = crypto.getRandomValues(new Uint8Array(16));
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const key = await this.deriveKey(passphrase, salt);
        const encoded = new TextEncoder().encode(JSON.stringify(plainObject));
        const cipher = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, encoded);

        return {
          salt: btoa(String.fromCharCode.apply(null, salt)),
          iv: btoa(String.fromCharCode.apply(null, iv)),
          data: btoa(String.fromCharCode.apply(null, new Uint8Array(cipher)))
        };
      },

      async decrypt(cipherPackage, passphrase) {
        if (!cipherPackage) throw new Error("Empty payload");
        const sB64 = cipherPackage.salt || cipherPackage.s;
        const iB64 = cipherPackage.iv || cipherPackage.i;
        const dB64 = cipherPackage.data || cipherPackage.d;

        if (!sB64 || !iB64 || !dB64) throw new Error("Invalid cipher structure");

        const salt = Uint8Array.from(atob(sB64), c => c.charCodeAt(0));
        const iv = Uint8Array.from(atob(iB64), c => c.charCodeAt(0));
        const cipher = Uint8Array.from(atob(dB64), c => c.charCodeAt(0));
        const key = await this.deriveKey(passphrase, salt);

        const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, cipher);
        return JSON.parse(new TextDecoder().decode(decrypted));
      },

      getNextPatientId() {
        const ids = Object.keys(APP_STATE.patients || {});
        let max = 0;
        ids.forEach(id => {
          const match = id.match(/SGMP-?(\d+)/i) || id.match(/SGM-?(\d+)/i);
          if (match && match[1]) {
            const n = parseInt(match[1], 10);
            if (n > max && n < 1000) max = n;
          }
        });
        const next = max + 1;
        return `SGMP-${next < 10 ? '0' + next : next}`;
      },

      generateKey(len = 24) {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
        return Array.from(crypto.getRandomValues(new Uint8Array(len)))
          .map(b => chars[b % chars.length]).join('');
      }
    };

    // ==========================================
    // 3. GITHUB API LIVE SYNC
    // ==========================================
    const GitHubSync = {
      async pullRemoteData(targetRepo) {
        const repo = targetRepo || APP_STATE.config.repo;
        const path = APP_STATE.config.path || 'data.json';
        const token = APP_STATE.config.token;

        if (!repo) throw new Error("Repo name missing");

        if (token) {
          const url = `https://api.github.com/repos/${repo}/contents/${path}`;
          const res = await fetch(url, {
            headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' },
            cache: 'no-store'
          });

          if (res.status === 404) return { sha: null, data: { version: 1, records: {} } };
          if (!res.ok) throw new Error(`GitHub error: ${res.statusText}`);

          const json = await res.json();
          APP_STATE.fileSha = json.sha;
          localStorage.setItem('sgm_file_sha', json.sha);

          const content = decodeURIComponent(escape(atob(json.content)));
          return { sha: json.sha, data: JSON.parse(content) };
        }

        const rawUrl = `https://raw.githubusercontent.com/${repo}/main/${path}`;
        const rawRes = await fetch(rawUrl, { cache: 'no-store' });
        if (rawRes.ok) {
          const rJson = await rawRes.json();
          return { sha: null, data: rJson };
        }

        throw new Error("Could not fetch remote file");
      },

      async pushRemoteData(dataPayload) {
        const { repo, path, token } = APP_STATE.config;
        if (!token || !repo) throw new Error("Token/Repo missing");

        const url = `https://api.github.com/repos/${repo}/contents/${path}`;
        
        let currentSha = APP_STATE.fileSha;
        try {
          const checkRes = await fetch(url, {
            headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' },
            cache: 'no-store'
          });
          if (checkRes.ok) {
            const checkJson = await checkRes.json();
            currentSha = checkJson.sha;
            APP_STATE.fileSha = currentSha;
            localStorage.setItem('sgm_file_sha', currentSha);
          }
        } catch (e) {}

        const utf8Content = btoa(unescape(encodeURIComponent(JSON.stringify(dataPayload, null, 2))));
        const bodyData = { message: `SGM Rx Update: ${new Date().toISOString()}`, content: utf8Content };
        if (currentSha) bodyData.sha = currentSha;

        const res = await fetch(url, {
          method: 'PUT',
          headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify(bodyData)
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.message || 'GitHub save failed');
        }

        const resJson = await res.json();
        APP_STATE.fileSha = resJson.content.sha;
        localStorage.setItem('sgm_file_sha', APP_STATE.fileSha);
      }
    };

    // ==========================================
    // 4. DAILY COUNTDOWN STATS CALCULATOR
    // ==========================================
    function calculateLiveMedStats(m, patientCreatedDate) {
      let perDay = 0;
      if (m.morn) perDay += parseFloat(m.mornQty || 1);
      if (m.noon) perDay += parseFloat(m.noonQty || 1);
      if (m.eve) perDay += parseFloat(m.eveQty || 1);
      if (m.night) perDay += parseFloat(m.nightQty || 0.5);
      if (perDay <= 0) perDay = 1;

      const totalInitial = parseFloat(m.initialQty !== undefined ? m.initialQty : (m.qty || 0));
      const startTimestamp = m.startDate || m.lastRefillDate || patientCreatedDate || Date.now();
      const now = Date.now();

      const elapsedDays = Math.max(0, Math.floor((now - startTimestamp) / (1000 * 60 * 60 * 24)));
      const consumedTabs = elapsedDays * perDay;

      const remainingTabs = Math.max(0, totalInitial - consumedTabs);
      const daysLeft = Math.max(0, Math.floor(remainingTabs / perDay));

      return {
        remainingTabs: remainingTabs % 1 === 0 ? remainingTabs : Number(remainingTabs.toFixed(1)),
        daysLeft: daysLeft,
        perDay: perDay,
        elapsedDays: elapsedDays
      };
    }

    // ==========================================
    // 5. VIEW RENDERING ENGINE
    // ==========================================
    function renderAdminDashboard() {
      const root = document.getElementById('viewRoot');
      if (!root) return;

      const patients = Object.values(APP_STATE.patients || {});

      const allActiveMedications = [];
      patients.forEach(p => {
        (p.medicines || []).forEach(m => {
          if (!m.discontinued) {
            const stats = calculateLiveMedStats(m, p.created || p.lastUpdated);
            allActiveMedications.push({
              patientId: p.id,

    async function renderPatientDirectView(patientId, accessKey, repoParam) {
      const root = document.getElementById('viewRoot');
      root.innerHTML = `<div class="p-8 text-center text-xs text-slate-500">Loading Patient Timeline...</div>`;

      try {
        const repo = repoParam || APP_STATE.config.repo;
        const remote = await GitHubSync.pullRemoteData(repo);
        const records = (remote && remote.data) ? (remote.data.records || remote.data.patients || {}) : {};
        if (!records[patientId]) throw new Error("Patient not found in cloud database.");

        const cipherObj = records[patientId];
        let patientData = null;

        if (accessKey) {
          try { patientData = await CryptoEngine.decrypt(cipherObj, accessKey); } catch (e) {}
        }
        if (!patientData && APP_STATE.config.pass) {
          try { patientData = await CryptoEngine.decrypt(cipherObj, APP_STATE.config.pass); } catch (e) {}
        }
        if (!patientData && APP_STATE.patientKeys[patientId]) {
          try { patientData = await CryptoEngine.decrypt(cipherObj, APP_STATE.patientKeys[patientId]); } catch (e) {}
        }

        if (!patientData) throw new Error("Record key mismatch. Please re-save from admin counter.");

        const activeMeds = (patientData.medicines || []).filter(m => !m.discontinued);

        root.innerHTML = `
          <div class="bg-[#0f766e] text-white rounded-2xl p-4 shadow-sm mb-4">
            <span class="text-[10px] font-mono bg-white/20 px-2 py-0.5 rounded font-bold">${patientData.id}</span>
            <h2 class="text-lg font-bold mt-1">${patientData.name}</h2>
            <p class="text-xs text-teal-100">Consulting Doctor: <b>${patientData.doctor || 'General'}</b></p>
          </div>
          <div class="mb-3 text-xs font-bold text-slate-500 uppercase">Aapki Active Dawaiyan (${activeMeds.length})</div>
          <div class="space-y-3">${renderMedicationList(patientData.medicines || [], true, patientData.created || patientData.lastUpdated)}</div>
        `;
      } catch (err) {
        root.innerHTML = `
          <div class="bg-white p-6 rounded-2xl border border-red-200 text-center space-y-2">
            <h3 class="text-sm font-bold text-red-600">Access Error</h3>
            <p class="text-xs text-slate-500">${err.message}</p>
          </div>
        `;
      }
    }

      e.preventDefault();
      const p = APP_STATE.patients[APP_STATE.currentPatientId];
      const editIdx = parseInt(document.getElementById('medEditIndex').value);
      const existingStartDate = document.getElementById('medExistingStartDate').value;
      const isRevisedChecked = document.getElementById('isDoctorRevised').checked;
      const enteredQty = parseFloat(document.getElementById('mTotalQty').value) || 0;

      const medData = {
        name: document.getElementById('mName').value.trim(),
        morn: document.getElementById('mornCheck').checked,
        mornQty: parseFloat(document.getElementById('mornQty').value) || 1,
        noon: document.getElementById('noonCheck').checked,
        noonQty: parseFloat(document.getElementById('noonQty').value) || 1,
        eve: document.getElementById('eveCheck').checked,
        eveQty: parseFloat(document.getElementById('eveQty').value) || 1,
        night: document.getElementById('nightCheck').checked,
        nightQty: parseFloat(document.getElementById('nightQty').value) || 0.5,
        meal: document.getElementById('mMeal').value,
        initialQty: enteredQty,
        qty: enteredQty,
        startDate: (editIdx > -1 && existingStartDate && !isRevisedChecked) ? parseInt(existingStartDate, 10) : Date.now(),
        instructions: document.getElementById('mInstructions').value.trim(),
        discontinued: false,
        history: []
      };

      if (!p.medicines) p.medicines = [];

      if (editIdx > -1) {
        const old = p.medicines[editIdx];
        if (isRevisedChecked) {
          medData.history = old.history || [];
          medData.history.unshift({ date: new Date().toLocaleDateString(), reason: document.getElementById('mChangeReason').value.trim() || 'Dose revised' });
          medData.startDate = Date.now();
        } else {
          medData.history = old.history || [];
          if (old.initialQty !== enteredQty) medData.startDate = Date.now();
        }
        p.medicines[editIdx] = medData;
      } else {
        p.medicines.push(medData);
      }

      p.lastUpdated = Date.now();
      saveLocalData();
      closeModal('medModal');
      renderAdminPatientView(p.id);

      if (APP_STATE.config.token && APP_STATE.config.pass) await saveToGitHubCloud();
    }

      const p = APP_STATE.patients[APP_STATE.currentPatientId];

      p.medicines[idx].discontinued = true;

      saveLocalData();
      renderAdminPatientView(p.id);
      if (APP_STATE.config.token && APP_STATE.config.pass) saveToGitHubCloud();
    }

    // ==========================================
    // 8. CLOUD SYNC & BACKUP
    // ==========================================
    async function manualSync(silent = false) {
      try {
        const { token, repo, pass } = APP_STATE.config;
        if (!token || !repo) { if (!silent) openModal('settingsModal'); return; }
        if (!pass) { if (!silent) alert("Enter Master Key in settings!"); return; }

        const remote = await GitHubSync.pullRemoteData();
        if (remote && remote.data) {
          const cloudRecords = remote.data.records || remote.data.patients || {};
          const cloudKeyReg = remote.data.keyRegistry;

          if (cloudKeyReg) {
            try {
              const decryptedKeys = await CryptoEngine.decrypt(cloudKeyReg, pass);
              APP_STATE.patientKeys = Object.assign({}, APP_STATE.patientKeys, decryptedKeys);
            } catch (e) {}
          }

          let count = 0;
          for (let id in cloudRecords) {
            const cipherObj = cloudRecords[id];
            let decryptedPatient = null;

            const pKey = APP_STATE.patientKeys[id];
            if (pKey) {
              try { decryptedPatient = await CryptoEngine.decrypt(cipherObj, pKey); } catch (e) {}
            }

            if (!decryptedPatient) {
              try {
                decryptedPatient = await CryptoEngine.decrypt(cipherObj, pass);
                if (!decryptedPatient.accessKey) decryptedPatient.accessKey = CryptoEngine.generateKey(24);
                APP_STATE.patientKeys[id] = decryptedPatient.accessKey;
              } catch (e) {}
            }

            if (decryptedPatient) {
              APP_STATE.patients[id] = decryptedPatient;
              count++;
            }
          }

          saveLocalData();
          if (!APP_STATE.isPatientView) renderAdminDashboard();
          if (!silent) showToast(`Synced ${count} patient records!`);
        }
      } catch (err) {
        if (!silent) alert('Sync Error: ' + err.message);
      }
    }

    async function saveToGitHubCloud() {
      const { repo, token, pass } = APP_STATE.config;
      if (!repo || !token || !pass) return;

      try {
        const remote = await GitHubSync.pullRemoteData();
        const cloudJson = remote ? remote.data : { version: 1, store: "Shree Ganesh Medicals", records: {} };
        if (!cloudJson.records) cloudJson.records = cloudJson.patients || {};

        for (let id in APP_STATE.patients) {
          const p = APP_STATE.patients[id];
          let pKey = p.accessKey || APP_STATE.patientKeys[id];
          if (!pKey) { pKey = CryptoEngine.generateKey(24); p.accessKey = pKey; APP_STATE.patientKeys[id] = pKey; }
          cloudJson.records[id] = await CryptoEngine.encrypt(p, pKey);
        }

        cloudJson.keyRegistry = await CryptoEngine.encrypt(APP_STATE.patientKeys, pass);
        cloudJson.updated_at = new Date().toISOString();

        await GitHubSync.pushRemoteData(cloudJson);
        showToast("Cloud sync successful! ✅");
      } catch (err) {
        showToast("Cloud sync error: " + err.message);
      }
    }

    function exportToExcel() {
      const patients = Object.values(APP_STATE.patients || {});
      if (patients.length === 0) return alert("No patient data!");

      const rows = [["Patient ID", "Name", "Phone", "Doctor", "Medicine", "Live Stock", "Per Day", "Days Left"]];
      patients.forEach(p => {
        (p.medicines || []).forEach(m => {
          const stats = calculateLiveMedStats(m, p.created || p.lastUpdated);
          rows.push([`"${p.id}"`, `"${p.name}"`, `"${p.phone}"`, `"${p.doctor || ''}"`, `"${m.name}"`, `"${stats.remainingTabs}"`, `"${stats.perDay}"`, `"${stats.daysLeft}"`]);
        });
      });

      const blob = new Blob(["\uFEFF" + rows.map(r => r.join(",")).join("\r\n")], { type: "text/csv;charset=utf-8;" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `SGM_Patients_${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
    }

    function downloadJsonBackup() {
      const blob = new Blob([JSON.stringify({ patients: APP_STATE.patients, patientKeys: APP_STATE.patientKeys }, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `SGM_Backup_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
    }

    function restoreJsonBackup(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const json = JSON.parse(e.target.result);
          if (json.patients) {
            APP_STATE.patients = json.patients;
            if (json.patientKeys) APP_STATE.patientKeys = json.patientKeys;
            saveLocalData();
            renderAdminDashboard();
            closeModal('settingsModal');
            showToast("Backup restored!");
            if (APP_STATE.config.token && APP_STATE.config.pass) await saveToGitHubCloud();
          }
        } catch (err) { alert("Restore Failed"); }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    // ==========================================
    // 9. HELPERS & ROUTER INITIALIZER
    // ==========================================
    function saveLocalData() {
      localStorage.setItem('sgm_patients', JSON.stringify(APP_STATE.patients));
      localStorage.setItem('sgm_p_keys', JSON.stringify(APP_STATE.patientKeys));
    }

    function saveAndSyncSettings() {
      APP_STATE.config = {
        token: document.getElementById('cfgToken').value.trim(),
        repo: document.getElementById('cfgRepo').value.trim(),
        path: document.getElementById('cfgPath').value.trim() || 'data.json',
        pass: document.getElementById('cfgPass').value.trim()
      };
      localStorage.setItem('sgm_cfg', JSON.stringify(APP_STATE.config));
      closeModal('settingsModal');
      showToast('Settings saved. Syncing...');
      manualSync();
    }

    function populateSettingsForm() {
      document.getElementById('cfgToken').value = APP_STATE.config.token || '';
      document.getElementById('cfgRepo').value = APP_STATE.config.repo || '';
      document.getElementById('cfgPath').value = APP_STATE.config.path || 'data.json';
      document.getElementById('cfgPass').value = APP_STATE.config.pass || '';
    }

    function navigateTo(hash) { window.location.hash = hash; }
    function navigateHome() { if (!APP_STATE.isPatientView) navigateTo(''); }
    function openModal(id) { const el = document.getElementById(id); el.classList.remove('hidden'); el.classList.add('flex'); }
    function closeModal(id) { const el = document.getElementById(id); el.classList.add('hidden'); el.classList.remove('flex'); }

    function showToast(msg) {
      const c = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = 'bg-slate-900 text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow-lg';
      toast.innerText = msg;
      c.appendChild(toast);
      setTimeout(() => { toast.remove(); }, 2500);
    }

    function filterPatients(query) {
      const q = query.toLowerCase();
      const filtered = Object.values(APP_STATE.patients || {}).filter(p => 
        p.name.toLowerCase().includes(q) || p.phone.includes(q) || p.id.toLowerCase().includes(q)
      );
      document.getElementById('patientListContainer').innerHTML = renderPatientCardList(filtered);
    }

    async function router() {
      try {
        const hash = window.location.hash || '';
        if (hash.startsWith('#/view')) {
          APP_STATE.isPatientView = true;
          document.getElementById('headerEnvTag').innerText = 'Patient Pass';
          document.getElementById('topExportBtn').style.display = 'none';
          document.getElementById('topSyncBtn').style.display = 'none';
          document.getElementById('topSettingsBtn').style.display = 'none';

          const params = new URLSearchParams(hash.split('?')[1]);
          await renderPatientDirectView(params.get('id'), params.get('k'), params.get('repo'));
        } else if (hash.startsWith('#/patient/')) {
          APP_STATE.isPatientView = false;
          renderAdminPatientView(hash.replace('#/patient/', ''));
        } else {
          APP_STATE.isPatientView = false;
          renderAdminDashboard();
        }
      } catch (e) {
        console.error(e);
        renderAdminDashboard();
      }
    }

    window.addEventListener('hashchange', router);
    window.addEventListener('DOMContentLoaded', async () => {
      populateSettingsForm();
      await router();
      if (!APP_STATE.isPatientView && APP_STATE.config.token && APP_STATE.config.pass) {
        manualSync(true);
      }
    });
  </script>
</body>
